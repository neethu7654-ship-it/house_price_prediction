<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <style>
        body { background:black; color:white; font-family:Arial; }
        input, select, button { padding:8px; margin:5px; }
    </style>
</head>
<body>

<h2>House Price Prediction System</h2>

<form method="post">
    {% csrf_token %}

    <label for="area">Area (sqft):</label>
    <input name="area" placeholder="Area (sqft)" required>

    <label for="bedrooms">Bedrooms:</label>
    <input name="bedrooms" placeholder="Bedrooms" required>

    <label for="bathrooms">Bathrooms:</label>
    <input name="bathrooms" placeholder="Bathrooms" required>

    <label for="floors">Floors:</label>
    <input name="floors" placeholder="Floors" required>

    <label for="house_age">House Age:</label>
    <input name="house_age" placeholder="House Age" required>
    <br><br>

    <label for="yr_built">Year Built:</label>
    <input name="yr_built" placeholder="Year Built" required>

    <label for="yr_renovated">Year Renovated:</label>
    <input name="yr_renovated" placeholder="Year Renovated (0 if never)" required>

    <label for="sqft_basement">Basement Area (sqft):</label>
    <input name="sqft_basement" placeholder="Basement Area (sqft)" required>

    <label for="sqft_lot">Lot Area (sqft):</label>
    <input name="sqft_lot" placeholder="Lot Area (sqft)" required>
    <br><br>
    
    <label for="sqft_above">Above Ground Area (sqft):</label>
    <input name="sqft_above" placeholder="Above Ground Area (sqft)" required>

    <label for="grade">Grade:</label>
    <input name="grade" placeholder="Grade (1-13)" required>

    <label for="view">View Rating:</label>
    <input name="view" placeholder="View Rating (0-4)" required>
    <br><br>

    <label for="condition">Condition:</label>
    <select name="condition">
        <option value="Good">Good</option>
        <option value="Average">Average</option>
        <option value="Poor">Poor</option>
    </select>

    <label for="garage">Garage:</label>
    <select name="garage">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label for="waterfront">Waterfront:</label>
    <select name="waterfront">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>
    <br><br>
    <button type="submit" style="background-color: green; color: white; padding: 15px; font-size: 18px;"><b>Predict Price</b></button>
</form>

{% if prediction %}
<h3>Estimated Price: ₹ {{ prediction|floatformat:2 }}</h3>
{% endif %}

</body>
</html>
