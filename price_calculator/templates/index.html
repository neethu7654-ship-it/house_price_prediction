<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <style>
        body { background:black; color:white; font-family:Arial; }
        input, select, button { padding:8px; margin:5px; }
    </style>
</head>
<body>

<h2>House Price Prediction System</h2>

<form method="post">
    {% csrf_token %}
    <input name="area" placeholder="Area (sqft)" required>
    <input name="bedrooms" placeholder="Bedrooms" required>
    <input name="bathrooms" placeholder="Bathrooms" required>
    <input name="floors" placeholder="Floors" required>
    <input name="house_age" placeholder="House Age" required>
    <input name="yr_renovated" placeholder="Year Renovated (0 if never)" required>
    <input name="sqft_basement" placeholder="Basement Area (sqft)" required>
    <input name="lat" placeholder="Latitude" required>
    <input name="sqft_living15" placeholder="Living Area of 15 Nearest Neighbors (sqft)" required>
    <input name="sqft_lot" placeholder="Lot Area (sqft)" required>
    <input name="sqft_above" placeholder="Above Ground Living Area (sqft)" required>
    <input name="zipcode" placeholder="Zipcode" required>
    <input name="yr_built" placeholder="Year Built" required>
    <input name="waterfront" placeholder="Waterfront (Yes/No)" required>
    <input name="grade" placeholder="Grade (1-13)" required>
    <input name="view" placeholder="View Rating (0-4)" required>
    <input name="long" placeholder="Longitude" required>
    <input name="sqft_living" placeholder="Living Area (sqft)" required>

    <select name="condition">
        <option value="Good">Good</option>
        <option value="Average">Average</option>
        <option value="Poor">Poor</option>
    </select>

    <select name="garage">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <select name="waterfront">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <select name="location">
        <option value="Urban">Urban</option>
        <option value="Suburban">Suburban</option>
        <option value="Rural">Rural</option>
    </select>

    <button type="submit">Predict Price</button>
</form>

{% if prediction %}
<h3>Estimated Price: ₹ {{ prediction|floatformat:2 }}</h3>
{% endif %}

</body>
</html>
